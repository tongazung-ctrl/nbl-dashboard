name: Daily data refresh

on:
  schedule:
    # 01:00 UTC = 08:00 Asia/Bangkok (เวลาไทย)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Open-Meteo, ThaiWater, Air4Thai
        run: python tools/refresh_all.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json data/villages_daily.json data/air.json data/rain_alerts.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Daily data refresh (08:00 Thai)"
            git push
          fi
